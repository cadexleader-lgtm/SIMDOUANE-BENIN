openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: SimDouane SaaS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: simulations
    description: User simulation history
  - name: subscriptions
    description: Subscription plans and user subscriptions
  - name: users
    description: User profile management
  - name: admin
    description: Admin dashboard (super admin only)
  - name: transitaire
    description: Transitaire access requests and transitaire-only features

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Simulations ────────────────────────────────────────────────────────────
  /simulations:
    get:
      operationId: getSimulations
      tags: [simulations]
      summary: List user's simulations
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List of simulations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationListResponse"
        "401":
          description: Unauthorized
    post:
      operationId: createSimulation
      tags: [simulations]
      summary: Save a simulation result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSimulationInput"
      responses:
        "201":
          description: Simulation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Simulation"
        "401":
          description: Unauthorized
        "403":
          description: Simulation limit reached

  /simulations/stats:
    get:
      operationId: getSimulationStats
      tags: [simulations]
      summary: Get user's simulation statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationStats"
        "401":
          description: Unauthorized

  /simulations/{id}:
    delete:
      operationId: deleteSimulation
      tags: [simulations]
      summary: Delete a simulation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  # ── Subscription plans ─────────────────────────────────────────────────────
  /subscription-plans:
    get:
      operationId: getSubscriptionPlans
      tags: [subscriptions]
      summary: Get all active subscription plans
      responses:
        "200":
          description: Plans list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"

  # ── User subscription ──────────────────────────────────────────────────────
  /subscription:
    get:
      operationId: getUserSubscription
      tags: [subscriptions]
      summary: Get current user's subscription
      responses:
        "200":
          description: User subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSubscription"
        "401":
          description: Unauthorized

  # ── User profile ───────────────────────────────────────────────────────────
  /profile:
    get:
      operationId: getProfile
      tags: [users]
      summary: Get current user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    put:
      operationId: updateProfile
      tags: [users]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  # ── Admin ──────────────────────────────────────────────────────────────────
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List all users
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/users/{id}/status:
    put:
      operationId: updateUserStatus
      tags: [admin]
      summary: Update user status (activate/disable/suspend)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusInput"
      responses:
        "200":
          description: Updated
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/simulations:
    get:
      operationId: getAdminSimulations
      tags: [admin]
      summary: List all simulations (admin)
      parameters:
        - name: userId
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: All simulations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSimulationListResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /upgrade-request:
    post:
      operationId: createUpgradeRequest
      tags: [subscriptions]
      summary: User requests a subscription upgrade
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUpgradeRequestInput"
      responses:
        "201":
          description: Request created
        "401":
          description: Unauthorized

  /admin/upgrade-requests:
    get:
      operationId: getAdminUpgradeRequests
      tags: [admin]
      summary: List all upgrade requests
      responses:
        "200":
          description: List of upgrade requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpgradeRequest"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/upgrade-requests/{id}/process:
    put:
      operationId: processUpgradeRequest
      tags: [admin]
      summary: Mark an upgrade request as processed or dismissed
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessUpgradeRequestInput"
      responses:
        "200":
          description: Updated
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/users/{id}/assign-subscription:
    post:
      operationId: assignSubscription
      tags: [admin]
      summary: Manually assign a subscription plan to a user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignSubscriptionInput"
      responses:
        "200":
          description: Subscription assigned
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/users/{id}/subscription:
    delete:
      operationId: revokeSubscription
      tags: [admin]
      summary: Revoke active subscription for a user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Subscription revoked
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/subscription-plans:
    get:
      operationId: getAdminSubscriptionPlans
      tags: [admin]
      summary: List all subscription plans (admin)
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: createSubscriptionPlan
      tags: [admin]
      summary: Create a subscription plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanInput"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlan"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/subscription-plans/{id}:
    put:
      operationId: updateSubscriptionPlan
      tags: [admin]
      summary: Update a subscription plan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanInput"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlan"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  # ── Accès transitaire (demande, justificatifs) ─────────────────────────────
  /transitaire-access:
    get:
      operationId: getTransitaireAccess
      tags: [transitaire]
      summary: Current user's transitaire status and applications
      responses:
        "200":
          description: Status and applications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransitaireAccess" }
        "401": { description: Unauthorized }

  /transitaire-access/applications:
    post:
      operationId: createTransitaireApplication
      tags: [transitaire]
      summary: Request transitaire access (declared agrément number)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTransitaireApplicationInput" }
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransitaireApplication" }
        "400": { description: Invalid input }
        "409": { description: "Already active, suspended or an application is pending" }

  /transitaire-access/applications/{id}/documents:
    post:
      operationId: uploadTransitaireDocument
      tags: [transitaire]
      summary: Attach a supporting document (PDF, JPEG or PNG, raw bytes)
      description: The file name is sent URI-encoded in the X-File-Name header. The type is detected from the bytes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Document stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredDocument" }
        "404": { description: Application not found }
        "409": { description: Application already decided or document limit reached }
        "413": { description: File too large }
        "415": { description: Unsupported file type }

  /transitaire-access/applications/{id}/documents/{fileId}/download-link:
    post:
      operationId: createTransitaireDocumentLink
      tags: [transitaire]
      summary: Short-lived download link for one of the user's own documents (logged)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Temporary link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadLink" }
        "404": { description: Not found }

  /transitaire/space:
    get:
      operationId: getTransitaireSpace
      tags: [transitaire]
      summary: Entry point of the transitaire space (active transitaires only)
      responses:
        "200":
          description: Transitaire space
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransitaireSpace" }
        "403": { description: Transitaire access not active }

  /admin/transitaire-applications:
    get:
      operationId: listAdminTransitaireApplications
      tags: [admin]
      summary: Transitaire access applications
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [submitted, approved, rejected, all] } }
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminTransitaireApplication" }

  /admin/transitaire-applications/{id}:
    get:
      operationId: getAdminTransitaireApplication
      tags: [admin]
      summary: Application detail with documents and decision history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTransitaireApplicationDetail" }
        "404": { description: Not found }

  /admin/transitaire-applications/{id}/documents/{fileId}/download-link:
    post:
      operationId: createAdminTransitaireDocumentLink
      tags: [admin]
      summary: Short-lived link to a supporting document (every call is logged)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Temporary link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadLink" }
        "404": { description: Not found }

  /admin/transitaire-applications/{id}/decision:
    post:
      operationId: decideTransitaireApplication
      tags: [admin]
      summary: Approve or reject an application
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitaireDecisionInput" }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTransitaireApplicationDetail" }
        "403": { description: Self-decision forbidden }
        "409": { description: Already decided }
        "422": { description: Approval requires at least one supporting document }

  /admin/transitaires:
    get:
      operationId: listAdminTransitaires
      tags: [admin]
      summary: Accounts with transitaire rights (active, suspended, revoked)
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminTransitaireUser" }

  /admin/users/{id}/transitaire-status:
    post:
      operationId: changeTransitaireStatus
      tags: [admin]
      summary: Suspend, reinstate or revoke transitaire rights
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitaireStatusChangeInput" }
      responses:
        "200":
          description: New status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTransitaireUser" }
        "400": { description: Reason required }
        "409": { description: Transition not allowed from the current status }

  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [admin]
      summary: Security journal (most recent first)
      parameters:
        - { name: targetType, in: query, schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLogEntry" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Simulation schemas ────────────────────────────────────────────────────
    CreateSimulationInput:
      type: object
      required: [marque, modele, annee, cylindree, carburant, valeurCIF, joursAuPort, regime, totalDouane, totalPort, totalGeneral]
      properties:
        marque:       { type: string }
        modele:       { type: string }
        annee:        { type: integer }
        cylindree:    { type: string }
        carburant:    { type: string }
        valeurCIF:    { type: number }
        joursAuPort:  { type: integer }
        regime:       { type: string }
        totalDouane:  { type: number }
        totalPort:    { type: number }
        totalGeneral: { type: number }
        condition:    { type: string, nullable: true, default: Occasion }
        powertrain:   { type: string, nullable: true }
        referenceDate: { type: string, nullable: true }
        regulatoryYear: { type: integer, nullable: true }
        calculatorVersion: { type: string, nullable: true }
        regulatoryConfigVersion: { type: string, nullable: true }

    Simulation:
      type: object
      required: [id, userId, marque, modele, annee, cylindree, carburant, valeurCIF, joursAuPort, regime, totalDouane, totalPort, totalGeneral, createdAt]
      properties:
        id:           { type: string }
        userId:       { type: string }
        marque:       { type: string }
        modele:       { type: string }
        annee:        { type: integer }
        cylindree:    { type: string }
        carburant:    { type: string }
        valeurCIF:    { type: number }
        joursAuPort:  { type: integer }
        regime:       { type: string }
        totalDouane:  { type: number }
        totalPort:    { type: number }
        totalGeneral: { type: number }
        condition:    { type: string, nullable: true }
        powertrain:   { type: string, nullable: true }
        referenceDate: { type: string, nullable: true }
        regulatoryYear: { type: integer, nullable: true }
        calculatorVersion: { type: string, nullable: true }
        regulatoryConfigVersion: { type: string, nullable: true }
        createdAt:    { type: string, format: date-time }

    SimulationListResponse:
      type: object
      required: [simulations, total]
      properties:
        simulations:
          type: array
          items:
            $ref: "#/components/schemas/Simulation"
        total: { type: integer }

    SimulationStats:
      type: object
      required: [totalSimulations, thisMonthSimulations, avgTotal, monthlyLimit, simUsedThisMonth]
      properties:
        totalSimulations:     { type: integer }
        thisMonthSimulations: { type: integer }
        avgTotal:             { type: number }
        monthlyLimit:         { type: integer, nullable: true }
        simUsedThisMonth:     { type: integer }

    # ── Plan schemas ──────────────────────────────────────────────────────────
    SubscriptionPlan:
      type: object
      required: [id, name, slug, priceMonthly, simulationsPerMonth, features, isActive]
      properties:
        id:                   { type: string }
        name:                 { type: string }
        slug:                 { type: string }
        priceMonthly:         { type: number }
        simulationsPerMonth:  { type: integer, nullable: true, description: "null = unlimited" }
        features:
          type: array
          items: { type: string }
        isActive:             { type: boolean }

    CreatePlanInput:
      type: object
      required: [name, slug, priceMonthly, features]
      properties:
        name:                 { type: string }
        slug:                 { type: string }
        priceMonthly:         { type: number }
        simulationsPerMonth:  { type: integer, nullable: true }
        features:
          type: array
          items: { type: string }

    UpdatePlanInput:
      type: object
      properties:
        name:                 { type: string }
        priceMonthly:         { type: number }
        simulationsPerMonth:  { type: integer, nullable: true }
        features:
          type: array
          items: { type: string }
        isActive:             { type: boolean }

    # ── User subscription ─────────────────────────────────────────────────────
    UserSubscription:
      type: object
      required: [plan, status, simUsedThisMonth]
      properties:
        plan:
          $ref: "#/components/schemas/SubscriptionPlan"
        status:              { type: string, enum: [active, expired, cancelled] }
        startDate:           { type: string, format: date-time, nullable: true }
        endDate:             { type: string, format: date-time, nullable: true }
        simUsedThisMonth:    { type: integer }

    # ── Profile schemas ───────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, clerkId, email, fullName, status, createdAt, onboarded]
      properties:
        id:        { type: string }
        clerkId:   { type: string }
        email:     { type: string }
        fullName:  { type: string }
        phone:     { type: string, nullable: true }
        whatsapp:  { type: string, nullable: true }
        poste:     { type: string, nullable: true }
        onboarded: { type: boolean }
        status:    { type: string, enum: [active, disabled, suspended] }
        createdAt: { type: string, format: date-time }
        accountKind: { type: string, enum: [particulier, entreprise] }
        organization:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Organization" }]
        transitaireStatus: { $ref: "#/components/schemas/TransitaireStatus" }

    UpdateProfileInput:
      type: object
      properties:
        fullName:  { type: string, nullable: true }
        phone:     { type: string, nullable: true }
        whatsapp:  { type: string, nullable: true }
        poste:     { type: string, nullable: true }
        onboarded: { type: boolean }
        accountKind: { type: string, enum: [particulier, entreprise] }
        legalName: { type: string, nullable: true }
        ifu:       { type: string, nullable: true }

    Organization:
      type: object
      required: [id, legalName]
      properties:
        id:        { type: string }
        legalName: { type: string }
        ifu:       { type: string, nullable: true }

    TransitaireStatus:
      type: string
      enum: [none, pending, active, suspended, revoked]

    StoredDocument:
      type: object
      required: [id, originalName, contentType, sizeBytes, createdAt]
      properties:
        id:           { type: string }
        originalName: { type: string }
        contentType:  { type: string }
        sizeBytes:    { type: integer }
        createdAt:    { type: string, format: date-time }

    TransitaireApplication:
      type: object
      required: [id, agrementNumber, status, createdAt, documents]
      properties:
        id:             { type: string }
        agrementNumber: { type: string }
        message:        { type: string, nullable: true }
        status:         { type: string, enum: [submitted, approved, rejected] }
        createdAt:      { type: string, format: date-time }
        decidedAt:      { type: string, format: date-time, nullable: true }
        decisionReason: { type: string, nullable: true }
        documents:
          type: array
          items: { $ref: "#/components/schemas/StoredDocument" }

    TransitaireAccess:
      type: object
      required: [status, canApply, applications]
      properties:
        status:          { $ref: "#/components/schemas/TransitaireStatus" }
        statusChangedAt: { type: string, format: date-time, nullable: true }
        canApply:        { type: boolean }
        applications:
          type: array
          items: { $ref: "#/components/schemas/TransitaireApplication" }

    CreateTransitaireApplicationInput:
      type: object
      required: [agrementNumber]
      properties:
        agrementNumber: { type: string, minLength: 2, maxLength: 60 }
        message:        { type: string, maxLength: 1000 }

    DownloadLink:
      type: object
      required: [url, expiresInSeconds]
      properties:
        url:              { type: string }
        expiresInSeconds: { type: integer }

    TransitaireSpace:
      type: object
      required: [status]
      properties:
        status:      { $ref: "#/components/schemas/TransitaireStatus" }
        activeSince: { type: string, format: date-time, nullable: true }

    TransitaireApplicant:
      type: object
      required: [id, fullName, email, accountKind, transitaireStatus]
      properties:
        id:                { type: string }
        fullName:          { type: string }
        email:             { type: string }
        poste:             { type: string, nullable: true }
        accountKind:       { type: string, enum: [particulier, entreprise] }
        transitaireStatus: { $ref: "#/components/schemas/TransitaireStatus" }

    AdminTransitaireApplication:
      type: object
      required: [id, agrementNumber, status, createdAt, documentsCount, user]
      properties:
        id:             { type: string }
        agrementNumber: { type: string }
        status:         { type: string, enum: [submitted, approved, rejected] }
        createdAt:      { type: string, format: date-time }
        decidedAt:      { type: string, format: date-time, nullable: true }
        documentsCount: { type: integer }
        user:           { $ref: "#/components/schemas/TransitaireApplicant" }

    TransitaireDecisionRecord:
      type: object
      required: [id, decision, createdAt]
      properties:
        id:            { type: string }
        decision:      { type: string, enum: [approved, rejected, suspended, reinstated, revoked] }
        reason:        { type: string, nullable: true }
        decidedByName: { type: string, nullable: true }
        applicationId: { type: string, nullable: true }
        createdAt:     { type: string, format: date-time }

    AdminTransitaireApplicationDetail:
      type: object
      required: [application, user, decisions]
      properties:
        application: { $ref: "#/components/schemas/TransitaireApplication" }
        user:        { $ref: "#/components/schemas/TransitaireApplicant" }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/TransitaireDecisionRecord" }

    TransitaireDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason:   { type: string, maxLength: 1000 }

    TransitaireStatusChangeInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [suspend, reinstate, revoke] }
        reason: { type: string, maxLength: 1000 }

    AdminTransitaireUser:
      type: object
      required: [id, fullName, email, transitaireStatus]
      properties:
        id:                         { type: string }
        fullName:                   { type: string }
        email:                      { type: string }
        transitaireStatus:          { $ref: "#/components/schemas/TransitaireStatus" }
        transitaireStatusChangedAt: { type: string, format: date-time, nullable: true }

    AuditLogEntry:
      type: object
      required: [id, actorRole, action, createdAt]
      properties:
        id:          { type: string }
        actorUserId: { type: string, nullable: true }
        actorName:   { type: string, nullable: true }
        actorRole:   { type: string }
        action:      { type: string }
        targetType:  { type: string, nullable: true }
        targetId:    { type: string, nullable: true }
        details:     { type: object, nullable: true, additionalProperties: true }
        createdAt:   { type: string, format: date-time }

    # ── Admin schemas ─────────────────────────────────────────────────────────
    AdminDashboard:
      type: object
      required: [totalUsers, activeSubscribers, totalSimulations, newUsersThisMonth, revenueThisMonth, revenueThisYear]
      properties:
        totalUsers:           { type: integer }
        activeSubscribers:    { type: integer }
        totalSimulations:     { type: integer }
        newUsersThisMonth:    { type: integer }
        revenueThisMonth:     { type: number }
        revenueThisYear:      { type: number }

    AdminUser:
      type: object
      required: [id, clerkId, email, fullName, status, planName, createdAt]
      properties:
        id:        { type: string }
        clerkId:   { type: string }
        email:     { type: string }
        fullName:  { type: string }
        phone:     { type: string, nullable: true }
        status:    { type: string, enum: [active, disabled, suspended] }
        planName:  { type: string }
        createdAt: { type: string, format: date-time }

    AdminUserListResponse:
      type: object
      required: [users, total]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total: { type: integer }

    AdminSimulation:
      allOf:
        - $ref: "#/components/schemas/Simulation"
        - type: object
          properties:
            userEmail:    { type: string }
            userFullName: { type: string }

    AdminSimulationListResponse:
      type: object
      required: [simulations, total]
      properties:
        simulations:
          type: array
          items:
            $ref: "#/components/schemas/AdminSimulation"
        total: { type: integer }

    UpdateUserStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled, suspended] }

    AssignSubscriptionInput:
      type: object
      required: [planId]
      properties:
        planId:         { type: string }
        durationMonths: { type: integer, nullable: true, description: "null = no expiry" }
        requestId:      { type: string, nullable: true, description: "Links activation atomically to a payment request" }

    CreateUpgradeRequestInput:
      type: object
      required: [planWanted, durationMonths, mobileMoneyPhone, mobileMoneyOperator, transactionReference, declaredAmount]
      properties:
        planWanted: { type: string, enum: [Standard, Pro] }
        durationMonths: { type: integer, enum: [1, 3, 6, 12], nullable: true }
        mobileMoneyPhone: { type: string }
        mobileMoneyOperator: { type: string, enum: [MTN MoMo, Moov Money, Celtiis Cash] }
        transactionReference: { type: string }
        declaredAmount: { type: number, minimum: 1 }
        receiptUrl: { type: string, nullable: true }
        message:    { type: string, nullable: true }

    ProcessUpgradeRequestInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [payment_under_review, approved, rejected, cancelled, processed, dismissed] }
        note: { type: string, nullable: true }

    UpgradeRequest:
      type: object
      required: [id, userId, userEmail, status, createdAt]
      properties:
        id:           { type: string }
        userId:       { type: string }
        userEmail:    { type: string }
        userFullName: { type: string, nullable: true }
        planWanted:   { type: string, nullable: true }
        durationMonths: { type: integer, nullable: true }
        mobileMoneyPhone: { type: string, nullable: true }
        mobileMoneyOperator: { type: string, nullable: true }
        transactionReference: { type: string, nullable: true }
        declaredAmount: { type: number, nullable: true }
        receiptUrl: { type: string, nullable: true }
        message:      { type: string, nullable: true }
        status:       { type: string, enum: [pending, processed, dismissed, submitted, payment_under_review, approved, activated, rejected, cancelled] }
        createdAt:    { type: string, format: date-time }
        processedAt:  { type: string, format: date-time, nullable: true }
        processedBy:  { type: string, nullable: true }
        processedNote: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
