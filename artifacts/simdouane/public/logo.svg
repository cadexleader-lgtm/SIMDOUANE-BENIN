<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#003D24"/>

  <!-- Beninese flag accent stripes at top -->
  <rect x="17" y="8" width="6" height="3" rx="1.5" fill="#008751"/>
  <rect x="25" y="8" width="14" height="3" rx="1.5" fill="#FCD116"/>
  <rect x="41" y="8" width="6" height="3" rx="1.5" fill="#E8112D"/>

  <!-- Yellow decorative ring circle behind anchor -->
  <circle cx="32" cy="37" r="18" fill="none" stroke="#FCD116" stroke-width="1" opacity="0.25"/>

  <!-- ANCHOR (white) -->
  <!-- Top ring (shackle) -->
  <circle cx="32" cy="20" r="5.5" fill="none" stroke="white" stroke-width="2.2"/>

  <!-- Vertical shaft -->
  <line x1="32" y1="25.5" x2="32" y2="50" stroke="white" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Horizontal crossbar -->
  <line x1="20" y1="33" x2="44" y2="33" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Crossbar end caps -->
  <circle cx="20" cy="33" r="2.5" fill="white"/>
  <circle cx="44" cy="33" r="2.5" fill="white"/>

  <!-- Left arm (fluke) -->
  <path d="M32 50 C28 47 23 44 21 40" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Right arm (fluke) -->
  <path d="M32 50 C36 47 41 44 43 40" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Arm tips -->
  <circle cx="21" cy="40" r="3" fill="white"/>
  <circle cx="43" cy="40" r="3" fill="white"/>

  <!-- Bottom ring (rope ring) in yellow -->
  <path d="M26 51 Q32 57 38 51" fill="none" stroke="#FCD116" stroke-width="2.2" stroke-linecap="round"/>
</svg>
